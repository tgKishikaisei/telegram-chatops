# Redis доступен только во внутренней сети Docker (сеть data без выхода наружу)
bind 0.0.0.0
protected-mode yes
port 6379

# Все ключи бота живут с TTL (диалоги, лимиты, блокировки), поэтому при нехватке памяти
# вытесняются самые давно неиспользуемые из них
maxmemory 128mb
maxmemory-policy volatile-lru

# Состояние диалогов переживает перезапуск
appendonly yes
appendfsync everysec
dir /data

loglevel notice
